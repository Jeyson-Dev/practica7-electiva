services:
  # Servidor de aplicacion (PHP + Apache)
  app:
    build: ./src
    container_name: holamundo-app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: holamundo
      DB_USER: app
      DB_PASSWORD: app123
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: holamundo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: holamundo
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
